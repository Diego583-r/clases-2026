<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        /* ### 4. Calculadora de combustible
        El programa debe pedir la cantidad inicial de combustible (en litros), el precio por litro y el consumo del vehículo cada 100 km. Después, solicita los kilómetros de cada viaje, calcula cuánto cuesta y cuántos litros quedan. Si no hay combustible suficiente para un viaje, muestra un aviso y termina.
        
        **Ejemplo:**
        ```text
        Introduce el combustible inicial: 50
        Precio del litro de combustible: 1.45
        Consumo cada 100 km: 5.6
        
        Introduce los kilómetros del viaje 1: 50
        Precio del viaje: 4.06€
        Combustible restante: 47.2 litros
        
        Introduce los kilómetros del viaje 2: 200
        Precio del viaje: 16.24€
        Combustible restante: 36 litros
        
        Introduce los kilómetros del viaje 3: 1000
        ¡Combustible insuficiente!
        ``` */

        const combustibleInicial = Number(prompt("Introduce el combustible inicial en litros: "))
        const precioCombustible = Number(prompt("Precio del litro de combustible: "))
        const consumoVehiculo100KM = Number(prompt("Introduce el consumo del vehiculo de litros cada 100 km: "))

        let kmViaje = 0;
        let precioViaje = 0;
        let consumoViaje = 0;
        let combustibleRestante = combustibleInicial
        let contadorViaje = 0; 

        while (combustibleRestante > 0) {
            contadorViaje++
            kmViaje = Number(prompt(" Introduce los kilómetros del viaje " + contadorViaje + ":"))
            consumoViaje = kmViaje * consumoVehiculo100KM / 100

            if (combustibleRestante >= consumoViaje) {
                precioViaje = consumoViaje * precioCombustible
                combustibleRestante = combustibleRestante - consumoViaje

                alert("Precio del viaje: " + precioViaje + "€")
                alert("Consumo viaje : " + consumoViaje + " litros")
                alert("Combustible restante: " + combustibleRestante + " litros")
            }

            else {
                alert("¡Combustible insuficiente!")
            }
        }

    </script>
</body>

</html>
