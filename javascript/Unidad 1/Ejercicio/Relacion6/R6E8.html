<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        /* ### 8\. Los tres hobbits
        
        1. **Crea tres hobbits.** Pide el nombre y la edad de tres hobbits. Crea una variable booleana para cada uno que indique si puede repetir comida.
        
        2. **Menor de edad.** Los hobbits alcanzan la mayoría de edad a los 33 años. Si un hobbit tiene menos de 33 años, automáticamente puede repetir.
        
        3. **Segunda oportunidad.** Suma las edades de los tres hobbits. Además de la condición anterior:
        
           - Si la suma es múltiplo de 2, el primer hobbit puede repetir.  
           - Si la suma es múltiplo de 3, el segundo hobbit puede repetir.  
           - Si la suma es múltiplo de 5, el tercer hobbit puede repetir.
        
           Por ejemplo, con una suma de 60 años, los tres pueden repetir.
        
        4. **Resultado.** Muestra qué hobbits pueden repetir y cuáles no.
        
        5. **EXTRA: Repartir.** Solo quedan dos platos extra:
        
           - Si los tres hobbits pueden repetir, muestra `Toca repartir la comida`.  
           - Si ninguno puede repetir, muestra `Va a sobrar comida`.  
           - Si pueden repetir uno o dos, muestra `¡A comer!`. */

        let nombreHobbit1 = prompt("Introduce el nombre del primer hobbit:");
        let edadHobbit1 = Number(prompt("Introduce la edad del primer hobbit:"));
        let puedeRepetir1 = false;

        let nombreHobbit2 = prompt("Introduce el nombre del segundo hobbit:");
        let edadHobbit2 = Number(prompt("Introduce la edad del segundo hobbit:"));
        let puedeRepetir2 = false;

        let nombreHobbit3 = prompt("Introduce el nombre del tercer hobbit:");
        let edadHobbit3 = Number(prompt("Introduce la edad del tercer hobbit:"));
        let puedeRepetir3 = false;

        let sumaEdades = edadHobbit1 + edadHobbit2 + edadHobbit3;

        if (edadHobbit1 < 33 || sumaEdades % 2 === 0) {
            puedeRepetir1 = true;
        }

        // Hobbit 2: Menor de 33 O la suma es múltiplo de 3
        if (edadHobbit2 < 33 || sumaEdades % 3 === 0) {
            puedeRepetir2 = true;
        }

        // Hobbit 3: Menor de 33 O la suma es múltiplo de 5
        if (edadHobbit3 < 33 || sumaEdades % 5 === 0) {
            puedeRepetir3 = true;
        }

        // 4. MOSTRAR RESULTADO INDIVIDUAL
        console.log("El hobbit " + nombreHobbit1 + " puede repetir: " + puedeRepetir1 + " (edad: " + edadHobbit1 + ")");
        console.log("El hobbit " + nombreHobbit2 + " puede repetir: " + puedeRepetir2 + " (edad: " + edadHobbit2 + ")");
        console.log("El hobbit " + nombreHobbit3 + " puede repetir: " + puedeRepetir3 + " (edad: " + edadHobbit3 + ")");

        let totalQuePuedenRepetir = 0;

        if (puedeRepetir1 === true) {
            totalQuePuedenRepetir++;
        }
        if (puedeRepetir2 === true) {
            totalQuePuedenRepetir++;
        }
        if (puedeRepetir3 === true) {
            totalQuePuedenRepetir++;
        }

        if (totalQuePuedenRepetir === 3) {
            console.log("Toca repartir la comida");
        } else if (totalQuePuedenRepetir === 0) {
            console.log("Va a sobrar comida");
        } else {
            console.log("¡A comer!");
        }

    </script>
</body>

</html>
