    <script>
        let distanciaUsuario = Number(prompt("Introduce la distancia recorrida en kilometros:"))

        let tiempoUsuario = Number(prompt("Introduce el tiempo en minutos:"))
        let velocidadMedia = distanciaUsuario / (tiempoUsuario / 60)
        console.log("La velocidad media es: ", velocidadMedia)

    </script>
