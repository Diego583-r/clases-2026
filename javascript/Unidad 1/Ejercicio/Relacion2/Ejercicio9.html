<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let caramelosUsuario = Number(prompt("Cuantos caramelos tienes?"))

        let numeroNinos = Number(prompt("Cuantos amigos hay?"))

        if (numeroNinos > 0) {
            let caramelosPorNino = parseInt(caramelosUsuario / numeroNinos)
            let caramelosSobrantes = caramelosUsuario % numeroNinos

            console.log("Cada amigo recibe: ", caramelosPorNino)
            console.log("Caramelos sobrantes: ", caramelosSobrantes)
        } else {
            console.log("Debe haber al menos un amigo.")
        }


    </script>


</body>

</html>
