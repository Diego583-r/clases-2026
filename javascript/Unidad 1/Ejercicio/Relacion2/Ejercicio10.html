<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let minutosCantidad = Number(prompt("Introduce la cantidad de minutos:"))
        let conversionHoras = parseInt(minutosCantidad / 60);
        let minutosSobrantes = minutosCantidad % 60;

        console.log("La cantidad de horas es: ", conversionHoras, "horas")
        console.log("Con ", minutosSobrantes, "minutos sobrantes")
    </script>


</body>

</html>
