
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>

        /*         ### 19.-  
        Solicitar dos números enteros. Mostrar el siguiente número múltiplo del primer número introducido, a partir del segundo número introducido.
        
        *Solución:* */

        let numero1 = Number(prompt("Introduce un número entero:"))
        let numero2 = Number(prompt("Introduce otro número entero:"))
        while (numero1 < 0 || numero2 < 0) {
            numero1 = Number(prompt("Error: Introduce un numero entero positivo"));
            numero2 = Number(prompt("Error: Introduce otro numero entero positivo"));
        }
        let multiplo = numero2 + 1
        while (multiplo % numero1 !== 0) {
            multiplo++
        }
        console.log("El siguiente múltiplo de " + numero1 + " a partir de " + numero2 + " es: " + multiplo);

    </script>
</body>

</html>
