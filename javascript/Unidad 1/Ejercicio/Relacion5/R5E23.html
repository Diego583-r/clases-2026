<body>
    <script>

        /*         ### 23.-  
        Solicitar un número entero. Dibujar una pirámide decreciente de asteriscos alineada a la derecha, con tantas filas como indique el número.  
        Ejemplo:
        ```
        *****
         ****
          ***
           **
            *
        ```
        *Solución:* */

        let numeroUsuario = Number(prompt("Introduce un número entero:"))
        let nAsteriscos = 0
        let cadanaAsteriscos = ""
        let nEspacios = 0
        while (numeroUsuario < 0) {
            numeroUsuario = Number(prompt("Error: Introduce un numero entero positivo"));
        }
        for (let i = 0; i < numeroUsuario; i++) {
            cadanaAsteriscos = ""
            nAsteriscos = numeroUsuario - i
            nEspacios = i
            for (let j = 0; j < nEspacios; j++) {
                cadanaAsteriscos += ' '
            }
            for (let j = 0; j < nAsteriscos; j++) {
                cadanaAsteriscos += '*'
            }
            console.log(cadanaAsteriscos);
        }

    </script>
</body>

</html>
