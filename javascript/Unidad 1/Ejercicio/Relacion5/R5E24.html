<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <script>

        /*        ### 24.-
       Solicitar un número entero. Dibujar una pirámide centrada en la que cada fila tenga dos asteriscos más que la anterior.  
       Ejemplo:
       ```
           **
          ****
         ******
        ********
       **********
       ```
       *Solución:* */

        let numeroUsuario = Number(prompt("Introduce un número entero:"))
        let nAsteriscos = 0;
        let espacios = 0;
        let cadenaAsteriscos = "";

        for (let i = 0; i < numeroUsuario; i++) {
            cadenaAsteriscos = "";
            nAsteriscos = 2 * (i + 1);
            espacios = numeroUsuario - (i + 1);

            for (let j = 0; j < espacios; j++) {
                cadenaAsteriscos += " ";
            }
            for (let j = 0; j < nAsteriscos; j++) {
                cadenaAsteriscos += "*";
            }
            console.log(cadenaAsteriscos);
        }

    </script>
</body>

</html>
