<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let numeroEntero = Number(prompt("Introduce un numero entero"))
        let colorUsuario = prompt("Introduce un color")
        let resultado = "";

        while (numeroEntero > 0) {
            resultado += colorUsuario+ " ";    
            numeroEntero--;
        }
        console.log(resultado);

    </script>
</body>

</html>
