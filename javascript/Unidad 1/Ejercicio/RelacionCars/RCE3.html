<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        /* ### 3. **Entrenamiento en el circuito de Radiador Springs**
        
        Crea un programa que simule un entrenamiento de 5 vueltas para un coche. En cada vuelta, se pide el tiempo (en segundos). Al final, muestra:
        
        * La vuelta más rápida
        * El tiempo total
        * El tiempo promedio
        
        > Utiliza `for` para iterar las vueltas y `if` para comprobar cuál es la más rápida.
        
        #### 🧪 Ejemplo:
        
        ```
        Tiempo vuelta 1: 60
        Tiempo vuelta 2: 58
        Tiempo vuelta 3: 62
        Tiempo vuelta 4: 57
        Tiempo vuelta 5: 59
        
        Tiempo total: 296
        Tiempo medio: 59.2
        La vuelta más rápida fue la 4 con 57 segundos.
        ``` */

        const VUELTAS = 5;
        let tiempoTotal = 0;
        let tiempoPromedio = 0;
        let vueltaMasRapida = Infinity;
        let numeroVueltaMasRapida = 0;
        let tiempoMasRapida = Infinity;

        for (let i = 1; i <= VUELTAS; i++) {
            let tiempoVuelta = parseFloat(prompt("Introduce el tiempo de la vuelta " + i + ": "));
            tiempoTotal += tiempoVuelta;
            if (tiempoVuelta < tiempoMasRapida) {
                tiempoMasRapida = tiempoVuelta;
                numeroVueltaMasRapida = i;
            }
        }

        tiempoPromedio = tiempoTotal / VUELTAS;

        console.log("Tiempo total: " + tiempoTotal);
        console.log("Tiempo medio: " + tiempoPromedio);
        console.log("La vuelta más rápida fue la " + numeroVueltaMasRapida + " con " + tiempoMasRapida + " segundos.");

    </script>
</body>

</html>
