<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        /* ### 4. **Clasificación de la Copa Pistón**
        
        El programa pide el número de coches en carrera. Por cada coche, solicita su nombre y puntos conseguidos (máximo 100). Si los puntos son:
        
        * 80 o más: 🥇 **Oro**
        * Entre 50 y 79: 🥈 **Plata**
        * Menos de 50: 🥉 **Fuera del podio**
        
        > Usa `for` y `if/else if/else` para determinar la categoría.
        
        #### 🧪 Ejemplo:
        
        ```
        Coche 1: Rayo - 95 puntos → Oro
        Coche 2: Sally - 78 puntos → Plata
        Coche 3: Guido - 42 puntos → Fuera del podio
        ``` */

        let numeroCoches = parseInt(prompt("Introduce el número de coches en carrera: "));

        for (let i = 1; i <= numeroCoches; i++) {
            let nombreCoche = prompt("Introduce el nombre del coche " + i + ": ");
            let puntosCoche = parseInt(prompt("Introduce los puntos del coche " + i + " (máximo 100): "));

            if (puntosCoche >= 80 && puntosCoche <= 100) {
                console.log("Coche " + i + ": " + nombreCoche + " - " + puntosCoche + " puntos → 🥇")
            } else if (puntosCoche >= 50 && puntosCoche < 80) {
                console.log("Coche " + i + ": " + nombreCoche + " - " + puntosCoche + " puntos → 🥈")
            } else if (puntosCoche < 50 && puntosCoche >= 0) {
                console.log("Coche " + i + ": " + nombreCoche + " - " + puntosCoche + " puntos → 🥉")
            } else {
                console.log("Coche " + i + ": " + nombreCoche + " - " + puntosCoche + " puntos → Puntos inválidos")
            }
        }

    </script>
</body>

</html>
