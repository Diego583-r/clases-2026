<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const MULTIPLICADOR1 = 1;
        const MULTIPLICADOR2 = 10;

        let numeroUsuario = Number(prompt("Ingresa un numero positivo del uno al 10 para ver su tabla de multiplicacion.")) 

            for (let i = MULTIPLICADOR1; i <= MULTIPLICADOR2; i++) {
                let resultado = numeroUsuario * i
                console.log(numeroUsuario + "x" + i + "=" + resultado);
            }
        

    </script>
</body>

</html>
