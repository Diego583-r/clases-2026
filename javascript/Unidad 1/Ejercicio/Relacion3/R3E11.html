<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let numeroUsuario = Number(prompt("Introduce un numero del 1 al 7."))
        if (numeroUsuario === 1 && numeroUsuario > 0) {
            console.log("Lunes");
        }
        if (numeroUsuario === 2 && numeroUsuario > 0) {
            console.log("Martes");
        }
        if (numeroUsuario === 3 && numeroUsuario > 0) {
            console.log("Miercoles");
        }
        if (numeroUsuario === 4 && numeroUsuario > 0) {
            console.log("Jueves");
        }
        if (numeroUsuario === 5 && numeroUsuario > 0) {
            console.log("Viernes");
        }
        if (numeroUsuario === 6 && numeroUsuario > 0) {
            console.log("Sabado");
        }
        if (numeroUsuario = 7 && numeroUsuario > 0) {
            
            console.log("Domingo");
        }

        else {
            console.log("El numero introducido no es valido");
        }


    </script>
</body>

</html>
