<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let numeroUsuario = Number(prompt("Ingresa un numero para determinar si es multiplo de 5."))

        if (numeroUsuario % 5 === 0) {
            console.log(numeroUsuario + " si es multiplo de 5.");
        }
        else {
            console.log(numeroUsuario + " no es multiplo de 5.");
        }



    </script>
</body>

</html>
