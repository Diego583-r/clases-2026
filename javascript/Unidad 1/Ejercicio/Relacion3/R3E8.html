<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let numeroUsuario = Number(prompt("Introduce tu numero preferido:"))

        if (numeroUsuario > 0) {
            console.log("Tu numero", numeroUsuario, "es positivo.");
        }
        else if (numeroUsuario === 0) {
            console.log("Tu numero es cero.");
        }
        else {
            console.log("Tu numero", numeroUsuario, "es negativo.");
        }


    </script>
</body>

</html>
