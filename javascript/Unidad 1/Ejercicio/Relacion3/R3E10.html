<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        let notaUsuario = Number(prompt("Introduce tu nota aqui:"))

        if (notaUsuario >= 90 && notaUsuario <= 100) {
            console.log("Tu nota es una A, con un", notaUsuario);
        }
        else if (notaUsuario >= 80 && notaUsuario <= 89) {
            console.log("Tu nota es una B, con un", notaUsuario);
        }
        else if (notaUsuario >= 70 && notaUsuario <= 79) {
            console.log("Tu nota es una C, con un", notaUsuario);
        }
        else if (notaUsuario >= 60 && notaUsuario <= 69) {
            console.log("Tu nota es una D, con un", notaUsuario);
        }
        else if (notaUsuario >= 0 && notaUsuario <= 59) { 
            console.log("Tu nota es una F, con un", notaUsuario);
        }

    </script>



</body>

</html>
