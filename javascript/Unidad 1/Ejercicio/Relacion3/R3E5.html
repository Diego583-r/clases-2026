<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const numeroUsuario = parseInt(prompt("Introduce un numero aqui:"))

        if (numeroUsuario >= 10 && numeroUsuario <= 20 ) {
            console.log("Tu numero si esta entre 10 y 20");
            
        }
        else {
            console.log("Tu numero esta fuera de esos dos rangos.");
            
        }


    </script>
</body>
</html>
