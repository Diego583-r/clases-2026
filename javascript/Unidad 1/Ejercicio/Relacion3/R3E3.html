<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let numeroUsuario1 = Number(prompt("Introduce el primer numero:"))
        let numeroUsuario2 = Number(prompt("Introduce el segundo numero:"))
        let numeroUsuario3 = Number(prompt("Introduce el ultimo numero:"))
        let calcularPromedio = (numeroUsuario1 + numeroUsuario2 + numeroUsuario3) / 3

        console.log("El promedio de los numeros es:", calcularPromedio);
    </script>
</body>

</html>
